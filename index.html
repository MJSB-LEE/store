<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store · MJSB Portal</title>
<style>
  body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:#f1f5f9;color:#0f172a}
  header{background:#0f172a;color:#fff;text-align:center;padding:26px 16px}
  header h1{margin:0;font-size:24px}
  header p{margin:6px 0 0;color:#cbd5e1;font-size:14px}
  header a{color:#cbd5e1;text-decoration:none;font-size:13px;display:inline-block;margin-bottom:8px}
  .wrap{max-width:1050px;margin:36px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
  .card{background:#fff;border:1px solid #e2e8f0;border-top:4px solid #b45309;border-radius:10px;padding:24px;text-decoration:none;color:inherit;display:block}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .card .ic{font-size:30px}
  .card h2{font-size:18px;margin:10px 0 6px}
  .card p{color:#64748b;font-size:14px;margin:0 0 14px;line-height:1.5}
  .card span{color:#b45309;font-weight:600;font-size:14px}
</style>
</head>
<body>
<header>
  <a href="../">← MJSB Portal</a>
  <h1>Store</h1>
  <p>Choose a module</p>
</header>
<div class="wrap">
  <a class="card" href="papan/">
    <div class="ic">📋</div>
    <h2>Papan</h2>
    <p>Bill send up to estate. Make, search and print bills by month.</p>
    <span>Open →</span>
  </a>
</div>
</body>
</html>
