<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papan · MJSB Store</title>
<meta name="theme-color" content="#0f172a">
<style>
:root{--navy:#0f172a;--bg:#f1f5f9;--line:#e2e8f0;--muted:#64748b;--blue:#1d4ed8;--red:#d32f2f;--green:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#0f172a;font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:7px 12px;color:#0f172a;white-space:nowrap}
button:hover{background:#f8fafc}
button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
button.pri:hover{background:#1e40af}
button.dan{color:var(--red);border-color:#fca5a5}
button.sm{padding:4px 8px;font-size:12px}
input,select{font:inherit;padding:7px 9px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;width:100%;color:#0f172a}
input:focus,select:focus{outline:2px solid #93c5fd;border-color:var(--blue)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.muted{color:var(--muted)}
.err{color:var(--red);font-size:13px;margin:8px 0 0}
.sp{flex:1}
.hidden{display:none!important}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:360px}
.lcard h1{font-size:20px;margin:0 0 4px}
.lcard .f{margin-top:12px}

/* app */
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:30}
.top a{color:#cbd5e1;text-decoration:none}
.top .crumb{font-size:13px;color:#cbd5e1}
.top .crumb b{color:#fff}
.top button{background:transparent;color:#fff;border-color:#334155}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 50px)}
.side{background:#fff;border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:var(--toph,50px);height:calc(100vh - var(--toph,50px));overflow-y:auto;align-self:start}
.grp{font-size:11px;color:var(--muted);margin:14px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
.mi{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;color:#334155;border:1px solid transparent}
.mi:hover{background:#f1f5f9}
.mi.on{background:#eff6ff;color:var(--blue);border-color:#bfdbfe;font-weight:600}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);background:#e9eef5;overflow-x:auto;position:sticky;top:var(--toph,50px);z-index:25}
.tab{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;background:#f8fafc;color:var(--muted);cursor:pointer;font-size:13px;white-space:nowrap}
.tab.on{background:#fff;color:#0f172a;font-weight:600;position:relative;top:1px}
.tab .x{color:#94a3b8;font-size:15px;line-height:1}
.tab .x:hover{color:var(--red)}
#content{padding:16px;background:#f8fafc;min-height:calc(100vh - 100px)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 6px;border-bottom:2px solid var(--line);background:#f1f5f9}
.tw table.t th{position:sticky;top:var(--stk,92px);z-index:6}
.dochead{position:sticky;top:var(--stk,92px);z-index:12;background:#f8fafc;margin:-16px -16px 12px;padding:12px 16px 0;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(15,23,42,.05)}
.dochead .subtabs{border-bottom:none;margin-bottom:0}
.docgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.docleft{position:sticky;top:calc(var(--stk,92px) + 64px);max-height:calc(100vh - var(--stk,92px) - 76px);overflow:auto;border-radius:8px}
.docleft .preview{zoom:.62;padding:12px}
.docright .fcard:first-child{margin-top:0}
@media (max-width:1100px){.docgrid{grid-template-columns:1fr}.docleft{position:static;max-height:none}.docleft .preview{zoom:.5}}
.dochead .bar{margin-bottom:8px}
.tw{overflow:visible}
table.t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click:hover td{background:#eff6ff;cursor:pointer}
.note-red{color:var(--red);font-weight:600}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.st{padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px}
.st.on{background:#eff6ff;color:var(--blue);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.card{background:#f1f5f9;border-radius:8px;padding:12px}
.card p{margin:0;font-size:12px;color:var(--muted)}
.card b{font-size:22px}
.docbox{display:inline-flex;align-items:center;gap:8px;background:#fef2f2;border:1px solid #fecaca;border-radius:999px;padding:4px 12px;font-size:13px;color:#7f1d1d;font-weight:normal}
.docbox input{width:64px;padding:2px 6px}
.docbox b{color:var(--red);font-size:15px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.fhead{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;margin-bottom:12px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fcard label{font-size:12.5px;color:#334155;font-weight:600;margin-bottom:5px}
.fcard select,.fcard input[type=date]{padding:10px 12px;background:#f8fafc;border-color:#cbd5e1;font-weight:500}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.btnlike{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:9px 14px;font-weight:500}
.btnlike:hover{background:#f1f5f9}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.th{position:relative;width:120px;height:120px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f1f5f9;cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(15,23,42,.65);color:#fff;font-size:10px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thx{position:absolute;top:4px;right:4px;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--red);border:none;font-size:16px}
.th.pk input{position:absolute;top:6px;left:6px;width:20px;height:20px;z-index:2}
.th.pk:has(input:checked){outline:3px solid var(--blue)}
.etiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.etile{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;cursor:pointer}
.etile:hover{border-color:#93c5fd;background:#f8fbff}
.etile b{font-size:15px}
.eic{font-size:34px;line-height:1}
.crumbs{font-size:14px}
.crumbs a{color:var(--blue);cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.folds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fold{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;cursor:pointer;position:relative}
.fold:hover{border-color:#93c5fd;background:#f8fbff}
.fview{padding:1px 8px;font-size:11px;margin-left:6px;font-weight:500}
.fold.pk input{position:absolute;top:8px;right:8px;width:20px;height:20px}
.fold.pk:has(input:checked){outline:3px solid var(--blue)}
.fcover{width:64px;height:64px;border-radius:8px;overflow:hidden;background:#f1f5f9;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.fcover img{width:100%;height:100%;object-fit:cover}
.fmeta{display:flex;flex-direction:column;gap:2px;font-size:12.5px;min-width:0}
.fmeta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fref{font-weight:600;font-size:13px;margin:6px 0}
.exp{font-weight:600;min-width:52px}
tr.subrow td{background:#f8fafc;padding:4px 6px 10px}
table.mini{border-collapse:collapse;font-size:12.5px;min-width:420px}
table.mini th,table.mini td{border:1px solid var(--line);padding:3px 10px;text-align:left;background:#fff}
table.mini th{background:#f1f5f9;color:var(--muted);font-weight:600}
.phone-only{display:none}
body.phone .phone-only{display:block}
body.phone .mi:not([data-m=photos]),body.phone .side .grp{display:none!important}
body.phone [data-act=openbill],body.phone [data-act=fprint],body.phone [data-act=lbprint],body.phone [data-act=fdl]{display:none!important}
body.phone .side{justify-content:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw}
.toast.bad{background:#b91c1c}
#sync{font-size:12px;display:flex;gap:8px;align-items:center}
.syncok{color:#86efac}.syncbad{color:#fca5a5;font-weight:600}.syncq{color:#fde68a;font-weight:600}
.bkup{background:#fef9c3;color:#713f12;padding:8px 16px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #fde68a}
.th.q img{opacity:.55}.th.q .cap{background:rgba(146,64,14,.85)}
button:disabled{opacity:.6;cursor:wait}
.tlnote{background:#fef9c3;color:#713f12;border-radius:6px;padding:1px 8px;font-size:12.5px}
.tl{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.tl:last-child{border-bottom:none}
.dot{width:10px;height:10px;border-radius:50%;background:#94a3b8;display:inline-block}
.dot-sent{background:#f59e0b}.dot-pending{background:#dc2626}.dot-received{background:#16a34a}.dot-undo{background:#dc2626}.dot-case_on{background:#ea580c}
#lb{position:fixed;inset:0;background:rgba(2,6,23,.85);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);font-size:44px;line-height:1;padding:6px 16px 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;border:none;z-index:2}
.lbnav:hover{background:rgba(255,255,255,.35)}
.lbprev{left:16px}.lbnext{right:16px}
#pdlg{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.pdbox{background:#fff;border-radius:12px;padding:18px 20px;width:100%;max-width:440px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pdopts{display:flex;flex-wrap:wrap;gap:8px}
.pdopts label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0;font-size:14px;color:#0f172a;cursor:pointer;font-weight:normal}
.pdopts label:has(input:checked){border-color:var(--blue);background:#eff6ff}
.pdopts input{width:auto}
#lb img{max-width:100%;max-height:80vh;border-radius:6px;background:#fff}
#lb .cap{color:#e2e8f0;font-size:13px}
.rq{color:var(--red);font-style:normal;font-weight:700}
.bad{border-color:var(--red)!important;background:#fef2f2!important}
.fcard select:hover,.fcard input[type=date]:hover{border-color:#94a3b8}
.preview{zoom:.8;background:#e2e8f0;padding:16px;border-radius:8px;overflow-x:auto}
.preview .a4{background:#fff;margin:0 auto 16px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
@media (max-width:820px){
  html,body{overflow-x:hidden}
  .layout{grid-template-columns:minmax(0,1fr)}
  main{min-width:0}
  .top{padding:8px 10px;gap:8px}
  .top .crumb{font-size:12px}
  #who{display:none}
  .top button{padding:4px 7px;font-size:11px}
  #content{padding:12px}
  .dochead{margin:-12px -12px 12px;padding:10px 12px 0}
  /* bill list as cards */
  .tw > table.t,.tw > table.t > tbody,#ltb{display:block}
  .tw thead{display:none}
  #ltb tr.click{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
  #ltb tr.click td{border:none;padding:0;font-size:13px;background:none}
  #ltb td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}
  #ltb .c-doc{font-size:16px!important;font-weight:700}
  #ltb .c-date{text-align:right;color:var(--muted)}
  #ltb .c-note:empty,#ltb .c-ph:empty{display:none}
  #ltb .c-st{grid-column:1/-1;border-top:1px dashed var(--line)!important;padding-top:8px!important}
  #ltb tr.subrow{display:block;margin:-6px 0 10px}
  #ltb > tr.subrow > td{display:block;padding:0}
  #ltb > tr.subrow > td:first-child{display:none}
  .setT,.setT tbody{display:block}
  .setT thead{display:none}
  .setT tr{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
  .setT td{border:none!important;padding:0!important;grid-column:2}
  .setT td:first-child{grid-column:1;grid-row:1 / span 6;font-weight:600}
  .usersT tr{grid-template-columns:minmax(0,1fr)}
  .usersT td,.usersT td:first-child{grid-column:1;grid-row:auto}
  table.mini{min-width:0;width:100%}
  /* new bill rows stacked */
  .rowsT,.rowsT tbody{display:block}
  .rowsT thead{display:none}
  .rowsT tr{display:grid;grid-template-columns:24px 96px minmax(0,1fr) 34px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .rowsT td{border:none!important;padding:0!important}
  .rowsT td:nth-child(4){grid-column:2/4;grid-row:2}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .docgrid{gap:12px}
  .th{width:96px;height:96px}
  .lbnav{font-size:34px;padding:4px 12px 8px}
  .lbprev{left:6px}.lbnext{right:6px}
  .etiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .etile{flex-direction:column;align-items:flex-start;gap:6px}
  .folds{grid-template-columns:minmax(0,1fr)}
  .side{display:flex;gap:4px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px;position:static;height:auto}
  .tw{overflow-x:auto}
  .tw table.t th{position:static}
  .side .grp{display:none}
  .mi{white-space:nowrap}
  .preview{zoom:.42}
  .docleft .preview{zoom:.42}
  .top .crumb span.h{display:none}
}

/* ===== A4 bill (preview + print) ===== */
.a4{width:210mm;height:297mm;padding:12mm 14mm 9mm;display:flex;flex-direction:column;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#111}
.a4 .co{text-align:center;font-size:22pt;margin:0 0 2mm}
.a4 .ti{text-align:center;font-size:13pt;font-style:italic;text-decoration:underline;border-top:1px solid #111;border-bottom:1px solid #111;padding:1.2mm 0;margin-bottom:2mm}
.a4 .red{color:#d32f2f}
.a4 .info{font-size:10.5pt;font-weight:bold;border-collapse:collapse}
.a4 .info td{padding:.6mm 0}
.a4 .info .l{width:36mm}
.a4 .dt{font-weight:normal;color:#7b3f6e;text-decoration:underline}
.a4 .note{text-align:center;color:#d32f2f;font-weight:bold;font-size:14pt;margin:1mm 0}
.a4 .it{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:2mm;font-size:10pt}
.a4 .it th,.a4 .it td{border:1px solid #111;text-align:center;height:5.8mm;padding:0 1mm;overflow:hidden;white-space:nowrap}
.a4 .it th{font-size:9pt}
.a4 .it td.v{font-weight:bold}
.a4 .rem{border:1px solid #111;border-top:none;padding:1.5mm 2mm;font-size:9.5pt;height:13mm;overflow:hidden;line-height:1.35}
.a4 .sg{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #111;margin-top:2mm;flex:1 1 auto;min-height:24mm;max-height:48mm}
.a4 .sg>div{border-right:1px solid #111;display:flex;flex-direction:column;justify-content:space-between;padding:1.5mm 2mm}
.a4 .sg>div:last-child{border-right:none}
.a4 .h{font-weight:bold;font-size:9pt}
.a4 .f{font-size:8pt;color:#333;border-top:1px dotted #777;padding-top:1mm}
.a4 .cont{font-style:italic;font-size:9pt;margin-top:2mm;flex:1 1 auto}
.a4 .bot{margin-top:2mm;display:flex;justify-content:space-between;font-size:8pt;color:#555}
.a4 .doc{color:#d32f2f}

#print{display:none}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  #login,#app,#lb,#pdlg{display:none!important}
  #print{display:block}
  #print .a4{page-break-after:always;break-after:page}
  #print .a4:last-child{page-break-after:auto;break-after:auto}
  @page port{size:A4 portrait;margin:0}
  @page land{size:A4 landscape;margin:0}
  #print .phs{box-sizing:border-box;padding:9mm;display:flex;flex-direction:column;gap:3mm;page-break-after:always;break-after:page;font-family:Arial,sans-serif;overflow:hidden}
  #print .phs:last-child{page-break-after:auto;break-after:auto}
  #print .phs.port{page:port;width:210mm;height:297mm}
  #print .phs.land{page:land;width:297mm;height:210mm}
  #print .phsh{display:flex;justify-content:space-between;font-size:9.5pt;border-bottom:1px solid #999;padding-bottom:1.5mm;flex:none}
  #print .phg{flex:1;display:grid;gap:4mm;min-height:0}
  #print .phg figure{margin:0;display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0;overflow:hidden}
  #print .phg img{flex:1;min-height:0;width:100%;object-fit:contain}
  #print .phg figcaption{font-size:8pt;color:#444;margin-top:1.5mm;text-align:center;flex:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login" class="hidden">
  <form class="lcard" id="lform">
    <h1>Papan</h1>
    <div class="muted">MJSB Store · Bill send up</div>
    <div class="f"><label>Username</label><input id="lu" autocomplete="username" required></div>
    <div class="f"><label>Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
    <div class="err hidden" id="lerr"></div>
    <div class="f"><button class="pri" style="width:100%">Log in</button></div>
    <div class="muted" style="font-size:12px;margin-top:12px">First time only: username <b>admin</b>, password <b>admin123</b>. Change it straight after (top bar › Change password).</div>
  </form>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <div class="top">
    <div class="crumb"><a href="../../">MJSB Portal</a> <span class="h">›</span> <a href="../">Store</a> › <b>Papan</b></div>
    <span class="sp"></span>
    <span id="sync"></span>
    <span id="who" style="font-size:13px;color:#cbd5e1"></span>
    <button class="sm" data-act="chpw">Change password</button>
    <button class="sm" data-act="logout">Logout</button>
  </div>
  <div id="bkup" class="bkup hidden"></div>
  <div class="layout">
    <nav class="side">
      <div class="grp">Papan</div>
      <div class="mi" data-act="menu" data-m="list">📋 Bill list</div>
      <div class="mi" data-act="menu" data-m="photos">📷 Photos</div>
      <div class="mi" data-act="menu" data-m="report">📊 Monthly report</div>
      <div class="grp admin-only">System</div>
      <div class="mi admin-only" data-act="menu" data-m="settings">⚙️ Settings</div>
    </nav>
    <main>
      <div class="tabs" id="tabs"></div>
      <div id="content"></div>
    </main>
  </div>
</div>

<!-- ===== PRINT AREA ===== -->
<div id="print"></div>
<input type="file" id="restoreFile" accept=".json" class="hidden">
<div id="pdlg" class="hidden" data-act="pdcancel"><div class="pdbox" data-act="lbnoop">
  <div class="fhead"><span>🖨 Print photos</span><span class="sp"></span><span class="muted" id="pdcount" style="font-weight:normal;font-size:13px"></span></div>
  <label style="margin-top:6px">Photos per A4</label>

class ApiErr extends Error{}
const ERR = {WRONG_LOGIN:'Wrong username or password.', NOT_LOGGED_IN:'Please log in again.', ADMIN_ONLY:'Only admin can do this.',
  DUP_DOC:'That doc number is already used. Change the number.', DUP_REF:'That folder ref is already used. Use another ref.',
  LOCKED:'This bill is locked after received. Ask admin to edit.', OTHER_PERSON:'You marked this bill as sent. Another person must confirm received.',
  NOTE_REQUIRED:'Please type the problem.', MISSING_FIELDS:'Some required fields are empty.', DUP_USER:'That username is already used.',
  SHORT_PASSWORD:'Password must be at least 6 characters.', BAD_USER:'Enter a username and a password of at least 6 characters.',
  NOT_SELF:'You cannot do that to your own account.', NOT_FOUND:'This item was deleted by someone else.', EMPTY_REF:'Folder ref cannot be empty.',
  NOTHING_TO_UNDO:'Nothing to undo.'};
function friendly(m){
  const [code, ...p] = String(m || '').split('|');
  if(ERR[code]) return ERR[code];
  if(code === 'CONFLICT') return `This bill was changed by ${p[0]} at ${p[1]}. Close this tab, open the bill again to see the latest, then make your change again.`;
  if(code === 'ALREADY') return `This bill is already ${p[0]}${p[1] ? ' (by ' + p[1] + (p[2] ? ', ' + p[2] : '') + ')' : ''}. The page is now refreshed.`;
  return m || 'Something went wrong.';
}
let netOk = true;
function setNet(ok){ if(netOk === ok) return; netOk = ok; showSync(); }
async function rpc(fn, args = {}){
  if(!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY) throw new ApiErr('Papan is not connected yet. Fill in CONFIG at the top of this file.');
  let r;
  try{ r = await fetch(CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {method:'POST',
        headers:{'Content-Type':'application/json', apikey:CONFIG.SUPABASE_KEY}, body:JSON.stringify(args)}); }
  catch(e){ setNet(false); throw new ApiErr('No internet connection. Try again.'); }
  setNet(true);
  if(r.status === 204) return null;
  const txt = await r.text(); let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){ j = txt; }
  if(!r.ok){
    const m = (j && j.message) || r.statusText;
    if(/NOT_LOGGED_IN/.test(m) && fn !== 'papan_login'){ logout('Please log in again.'); }
    throw new ApiErr(friendly(m));
  }
  return j;
}
const T = () => ({p_token:token});

/* ================= GOOGLE DRIVE (photos) ================= */
async function drive(action, data = {}){
  if(!CONFIG.DRIVE_URL) throw new ApiErr('Google Drive is not connected yet. Fill in DRIVE_URL in CONFIG.');
  let r;
  try{ r = await fetch(CONFIG.DRIVE_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({...data, action, token})}); }
  catch(e){ throw new ApiErr('Could not reach Google Drive. Check the internet.'); }
  const j = await r.json().catch(() => null);
  if(!j || !j.ok) throw new ApiErr((j && j.error) || 'Google Drive did not answer.');
  return j;
}

function b64ToBlob(b64, mime){ const bin = atob(b64), a = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type:mime || 'image/jpeg'}); }
function driveName(f){ const b = f.billId ? db.bills.find(x => x.id === f.billId) : null; return f.ref + (b ? ' (' + b.docno + ')' : ' (waiting)'); }

}

/* ================= UPLOAD QUEUE (keeps photos safe when the signal is weak) ================= */
const QDB = {
  db:null,
  open(){ if(this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => { const r = indexedDB.open('papan_queue', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('q', {keyPath:'qid'});
      r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); }); },
  async run(mode, fn){ const d = await this.open();
    return new Promise((res, rej) => { const tx = d.transaction('q', mode), rq = fn(tx.objectStore('q'));
      tx.oncomplete = () => res(rq ? rq.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); },
  add(it){ return this.run('readwrite', st => st.put(it)); },
  del(qid){ return this.run('readwrite', st => st.delete(qid)); },
  all(){ return this.run('readonly', st => st.getAll()); }
};
let qBusy = false, qErr = '', qN = 0;
async function qRefresh(){ try{ qN = (await QDB.all()).length; }catch(e){ qN = 0; } showSync(); }
async function queuePhotos(folderId, blobs){
  let at = Date.now();
  for(const b of blobs) await QDB.add({qid:uid(), folderId, blob:b, at:at++, by:me ? me.u : ''});
  await qRefresh(); runQueue();
}
async function runQueue(){
  if(qBusy || !token || !me) return; qBusy = true; qErr = '';
  const added = {};
  try{
    const items = (await QDB.all()).sort((a, b) => a.at - b.at);
    for(const it of items){
      const f = db.folders.find(x => x.id === it.folderId);
      if(!f){ if(since){ await QDB.del(it.qid); } continue; }
      try{
        const dfid = await ensureDriveFolder(f);
        const up = await drive('upload', {driveFolderId:dfid, name:fileName(f.ref) + '_' + String(it.at).slice(-7) + '.jpg', mime:'image/jpeg', data:await blobToB64(it.blob)});
        const ph = await rpc('papan_photo_add', {...T(), p_folder:f.id, p_drive_file_id:up.fileId, p_size:up.size || it.blob.size});
        upsert(db.photos, mapPhoto(ph)); await QDB.del(it.qid);
        added[f.id] = (added[f.id] || 0) + 1;
      }catch(e){ qErr = e.message; break; }
      await qRefresh();
    }
  }catch(e){ qErr = e.message; }
  finally{
    qBusy = false; await qRefresh();
    for(const fid in added){ const f = db.folders.find(x => x.id === fid);
      if(f && f.billId) rpc('papan_bill_note', {...T(), p_id:f.billId, p_act:'photos_added', p_extra:{photos:added[fid], ref:f.ref}}).then(() => refresh()).catch(() => {}); }
    if(Object.keys(added).length) softRender(true);
  }
}

let syncing = false, lastSync = 0;
function applyLoad(d, full){
  me = d.me;
  const st = d.settings || {};
  db.settings = {...clone(DEFAULT_SETTINGS), ...st};
  if(full){ db.bills = []; db.folders = []; db.photos = []; }
  (d.bills || []).forEach(r => upsert(db.bills, mapBill(r)));
  (d.folders || []).forEach(r => upsert(db.folders, mapFolder(r)));
  (d.photos || []).forEach(r => upsert(db.photos, mapPhoto(r)));
  if(d.users) db.users = d.users;
  since = new Date(Date.parse(d.now) - 5000).toISOString();
  lastSync = Date.now();
  return full || (d.bills || []).length || (d.folders || []).length || (d.photos || []).length;
}
let lastSettingsJson = '';
async function refresh(full){
  if(!token || syncing) return; syncing = true;
  try{
    const d = await rpc('papan_load', {...T(), p_since:full ? null : since});
    const sj = JSON.stringify(d.settings || {}), sChanged = sj !== lastSettingsJson; lastSettingsJson = sj;
    const changed = applyLoad(d, full || !since);
    showSync();
    if(changed || sChanged) softRender();
  }catch(e){ showSync(); }
  finally{ syncing = false; }
}

function softRender(force){
  const t = curTab(); if(!t || !me) return;

function toast(msg, bad){
  const el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), bad ? 6000 : 2600);
}
async function busy(el, fn){

const LISTS = {

/* ================= HELPERS ================= */
function today(){ const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'); }

function periodKey(date){ const r = db.settings.doc.reset; return r === 'm' ? date.slice(0,7) : r === 'y' ? date.slice(0,4) : '*'; }

function estateCode(estate){ const e = db.settings.estate.find(x => x.name === estate); return (e && e.code) ? e.code : (estate || '???'); }

  const p = db.settings.doc.pattern || '{NO}/{MM}', d = date || today();

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not read the photo.')), 'image/jpeg', 0.72);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file is not a photo.')); };
    img.src = url;
  });
}
const fmtTime = ts => ts ? new Date(ts).toLocaleString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '';
const stat = b => b.status || 'created';
const STAT = {created:['Created','#475569','#f1f5f9'], sent:['Sent','#92400e','#fef3c7'], pending:['⚠ Pending','#b91c1c','#fee2e2'], received:['Received','#166534','#dcfce7']};
function isOverdue(b){ return stat(b) === 'sent' && b.sentAt && Date.now() - b.sentAt > (+db.settings.photo.overdue || 3) * 864e5; }
function badge(b){
  const [n, c, bg] = STAT[stat(b)], od = isOverdue(b);
  return `<span class="badge" style="color:${od ? '#b91c1c' : c};background:${od ? '#fee2e2' : bg}">${od ? 'Overdue' : n}</span>${b.isCase ? ' <span class="badge" style="color:#9a3412;background:#ffedd5">⚑ Case</span>' : ''}`;
}

  return 'P-' + estateCode(estate) + '-' + n + '/' + (+ym.slice(5,7));

// create a folder online; if the automatic ref was just taken by someone else, try the next number
async function createFolder(p, billId){
  const auto = !(p.ref || '').trim();
  for(let bump = 0; bump < 8; bump++){
    const ref = auto ? folderRefAuto(p.estate, bump) : p.ref.trim().toUpperCase();
    try{
      const r = await rpc('papan_folder_save', {...T(), p_folder:{ref, company:p.company || '', estate:p.estate, note:(p.note || '').trim(), bill_id:billId || ''}});
      const f = mapFolder(r); upsert(db.folders, f); return f;
    }catch(e){ if(!auto || e.message !== ERR.DUP_REF) throw e; }

  throw new ApiErr(ERR.DUP_REF);
}

async function cleanupPhotos(){
  if(!me || me.role !== 'admin') return;
  try{ const ids = await rpc('papan_cleanup', T()); if(ids && ids.length){ await trashDrive(ids); refresh(); } }catch(e){}
}
function backupReminder(){
  const el = $('#bkup'); if(!el) return;
  let last = 0; try{ last = +localStorage.getItem('papan_last_backup') || 0; }catch(e){}
  const days = last ? Math.floor((Date.now() - last) / 864e5) : null;
  const show = me && me.role === 'admin' && (days === null || days >= 7);
  el.classList.toggle('hidden', !show);
  if(show) el.innerHTML = `💾 ${days === null ? 'No backup downloaded on this computer yet.' : 'Last backup was ' + days + ' days ago.'} <button class="sm pri" data-act="backup">⬇ Download backup now</button> <button class="sm" data-act="bkhide">Later</button>`;
}

/* ================= LOGIN ================= */
let me = null, lastActive = Date.now();
async function init(){
  showSync(); qRefresh();
  if(!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY) return showLogin('Papan is not connected to the online database yet. Ask IT to fill in CONFIG at the top of this file.');
  if(token){
    $('#login').classList.add('hidden');
    try{ const d = await rpc('papan_load', {...T(), p_since:null}); lastSettingsJson = JSON.stringify(d.settings || {}); applyLoad(d, true); return showApp(); }
    catch(e){ if(!token) return; return showLogin(e.message); }
  }
  showLogin();
}
function showLogin(msg){
  me = null;
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#lerr').classList.toggle('hidden', !msg); $('#lerr').textContent = msg || '';
  $('#lp').value = '';
}
function showApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  document.querySelectorAll('.admin-only').forEach(e => e.classList.toggle('hidden', me.role !== 'admin'));
  if(!tabs.length) openTab(isPhone() ? {key:'photos', type:'photos', title:'Photos'} : {key:'list', type:'list', title:'Bill list'});
  else render();
  backupReminder(); cleanupPhotos(); runQueue();
}
$('#lform').onsubmit = async e => {
  e.preventDefault();
  const btn = $('#lform button'); btn.disabled = true; btn.textContent = 'Logging in…';
  try{
    const r = await rpc('papan_login', {p_username:$('#lu').value.trim(), p_password:$('#lp').value});
    token = r.token; try{ localStorage.setItem('papan_token', token); }catch(err){}
    const d = await rpc('papan_load', {...T(), p_since:null}); lastSettingsJson = JSON.stringify(d.settings || {}); applyLoad(d, true);
    lastActive = Date.now(); showApp();
  }catch(err){ showLogin(err.message); }
  finally{ btn.disabled = false; btn.textContent = 'Log in'; }
};
function logout(msg){
  const t = token; token = null; since = null;
  try{ localStorage.removeItem('papan_token'); }catch(e){}
  if(t) rpc('papan_logout', {p_token:t}).catch(() => {});
  tabs = []; cur = null; db = {settings:clone(DEFAULT_SETTINGS), bills:[], folders:[], photos:[], users:[]};
  showLogin(msg);
}
['click','keydown','touchstart'].forEach(ev => document.addEventListener(ev, () => lastActive = Date.now()));
setInterval(() => { if(me && Date.now() - lastActive > 8*60*60*1000) logout('Logged out after 8 hours of no use.'); }, 60000);

/* ================= TABS ================= */
let tabs = [], cur = null, tseq = 0;
const curTab = () => tabs.find(t => t.id === cur);
function openTab(t){
  const ex = tabs.find(x => x.key === t.key);
  if(ex) cur = ex.id; else { t.id = ++tseq; tabs.push(t); cur = t.id; }
  render();
}
function closeTab(id){
  const t = tabs.find(x => x.id === id);
  if(t && t.type === 'form' && t.dirty && !confirm('Close without saving?')) return;
  const i = tabs.findIndex(x => x.id === id);
  tabs.splice(i, 1);
  if(cur === id) cur = tabs.length ? tabs[Math.max(0, i-1)].id : null;
  render();
}

/* ================= RENDER ================= */
function setStick(){
  const top = document.querySelector('.top'), tb = $('#tabs'); if(!top || !tb) return;
  const r = document.documentElement.style, th = top.offsetHeight;
  r.setProperty('--toph', th + 'px'); r.setProperty('--stk', (th + tb.offsetHeight) + 'px');
}
window.addEventListener('resize', () => { setStick(); if(me && document.body.classList.contains('phone') !== isPhone()) render(); });
const isPhone = () => window.matchMedia('(max-width: 820px), (pointer: coarse) and (max-height: 500px)').matches;
const PHONE_OK = ['photos', 'newfolder'];
function phoneGuard(){
  const ph = isPhone(); document.body.classList.toggle('phone', ph);
  if(!ph) return;
  if(!tabs.some(x => x.type === 'photos')){ tabs.unshift({id:++tseq, key:'photos', type:'photos', title:'Photos'}); }
  const t = tabs.find(x => x.id === cur);
  if(!t || !PHONE_OK.includes(t.type)) cur = tabs.find(x => x.type === 'photos').id;
}
function render(){
  if(!me) return;
  phoneGuard();
  $('#who').textContent = me.u + ' (' + me.role + ')';
  const t = curTab();
  document.querySelectorAll('.mi[data-m]').forEach(e => e.classList.toggle('on', !!t && t.key === e.dataset.m));
  $('#tabs').innerHTML = tabs.filter(x => !isPhone() || PHONE_OK.includes(x.type)).map(x => `<div class="tab ${x.id === cur ? 'on' : ''}" data-act="tab" data-id="${x.id}">${esc(x.title)}<span class="x" data-act="close" data-id="${x.id}" title="Close">×</span></div>`).join('');
  $('#content').innerHTML = t ? VIEW[t.type](t) : '<p class="muted">Choose from the menu on the left.</p>';
  setStick();
  if(t && t.type === 'list') fillList(t);
  if(t && t.type === 'photos') loadLoose(t);
  if(t && t.type === 'form' && t.mode !== 'review') loadFormPick(t);
  if(t && t.type === 'view'){ const b = db.bills.find(x => x.id === t.billId); if(b) loadPhotos(b); }
}

function filtered(f){
  const q = (f.q || '').trim().toUpperCase();
  return db.bills.filter(b =>
    (q || !f.month || b.date.startsWith(f.month)) &&
    (!f.st || (f.st === 'overdue' ? isOverdue(b) : f.st === 'case' ? b.isCase : stat(b) === f.st)) &&
    (!f.estate || b.estate === f.estate) && (!f.driver || b.driver === f.driver) && (!f.vehicle || b.vehicle === f.vehicle) &&
    (!q || [b.docno, ...b.rows.flatMap(r => [r.ref, r.inv, r.sup])].join(' ').toUpperCase().includes(q))
  ).sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
}

    : `<tr><td colspan="10" class="muted" style="text-align:center;padding:20px">No bills found. Click "+ New bill" to add one.</td></tr>`;

/* ----- New / edit bill ----- */
function blankBill(){
  const s = db.settings;
  const company = s.company.length === 1 ? s.company[0].name : '', ests = estatesFor(company);
  const b = {company, estate:ests.length === 1 ? ests[0] : '', driver:'', vehicle:'', date:today(), note:'', remark:'',
             rows:Array.from({length:5}, () => ({ref:'', inv:'', sup:''}))};
  b.seq = nextSeq(b.estate, b.date);
  return b;
}
function findSup(v){ const u = String(v || '').trim().toUpperCase(); return names('supplier').find(x => x.toUpperCase() === u); }
const cleanRows = b => b.rows.filter(r => r.ref.trim() || r.inv.trim() || r.sup.trim());
function finalBill(b){ return {...b, docno:fmtDoc(+b.seq, b.date, b.estate), rows:cleanRows(b).map(r => ({ref:r.ref.trim(), inv:r.inv.trim().toUpperCase(), sup:findSup(r.sup) || r.sup.trim().toUpperCase()}))}; }
function checkBill(b){
  const e = [];
  if(!b.company) e.push('Choose a company.');
  if(!b.estate) e.push('Choose where the bill is sent up to.');
  if(!b.driver) e.push('Choose a driver.');
  if(!b.vehicle) e.push('Choose a vehicle.');
  if(!b.date) e.push('Choose the delivery date.');
  if(!(+b.seq > 0)) e.push('Doc number must be 1 or more.');
  const rows = cleanRows(b);
  if(!rows.length) e.push('Add at least one bill row.');
  b.rows.forEach((r, i) => {
    if(!(r.ref.trim() || r.inv.trim() || r.sup.trim())) return;
    if(!(r.ref.trim() && r.inv.trim() && r.sup.trim())) e.push(`Row ${i+1}: fill in B/REF, bill invoice and supplier.`);
    else if(!findSup(r.sup)) e.push(`Row ${i+1}: supplier "${r.sup.trim().toUpperCase()}" is not in the list. Choose from the list, or add it in Settings › Supplier.`);
  });
  return e;
}

VIEW.view = t => {
  const b = db.bills.find(x => x.id === t.billId);
  if(!b) return '<p class="muted">This bill was deleted.</p>';
  t.vt = t.vt || 'bill';
  const admin = me.role === 'admin', locked = stat(b) === 'received' && !admin;
  const head = `<div class="dochead"><div class="bar">${badge(b)}
      <span class="muted" style="font-size:12px">Created by ${esc(b.createdBy)} · ${fmtTime(b.createdAt)}</span>
      <span class="sp"></span>
      ${locked ? '<span class="muted" style="font-size:12px">🔒 Locked after received</span>' : '<button data-act="editbill">✏️ Edit</button>'}
      <button class="pri" data-act="printbill">🖨 Print</button>
      ${admin ? '<button class="dan" data-act="delbill">Delete</button>' : ''}
    </div>
    </div>`;
  const parts = statusHtml(t, b);
  return head + `<div class="docgrid">
      <div class="docleft"><div class="preview">${pagesHtml(b)}</div></div>
      <div class="docright">${parts.step}${parts.rest}</div>
    </div>`;
};
function statusHtml(t, b){
  const s = stat(b), admin = me.role === 'admin', next = s === 'created' ? 'sent' : (s === 'sent' || s === 'pending') ? 'received' : null;
  t.pick = t.pick || [];
  let step = '';
  if(s === 'created'){
    step = `<div class="fcard" style="border-color:#fcd34d">
      <div class="fhead"><span>🚚 Next: mark doc as sent</span></div>
      <p class="muted" style="margin:0 0 10px">Mark this when the doc goes out with the driver.</p>
      <button class="pri" data-act="mark">Mark as sent</button>
      ${t.perr ? `<p class="err">${esc(t.perr)}</p>` : ''}</div>`;
  } else if(next === 'received'){
    const samePerson = b.sentBy === me.u && !admin;
    step = `<div class="fcard" style="border-color:${s === 'pending' ? '#fca5a5' : '#86efac'}">
      <div class="fhead"><span>${s === 'pending' ? '⚠ Pending: problem with this doc' : '✅ Next: mark doc as received'}</span></div>
      ${s === 'pending' ? `<p style="margin:0 0 10px"><span class="tlnote">“${esc(b.pendingNote)}”</span> <span class="muted">${esc(b.pendingBy)} · ${fmtTime(b.pendingAt)}</span></p>` : ''}
      <p class="muted" style="margin:0 0 10px">${s === 'pending' ? 'When the problem is solved, mark it received.' : 'Mark this when the signed and stamped doc is back at the office. Only type a remark if there is a problem.'}</p>
      <div class="bar" style="margin:0"><input id="rcvNote" placeholder="${s === 'pending' ? 'Remark (optional): how it was solved' : 'Remark (only if there is a problem)'}" style="flex:1;min-width:240px" class="${t.perr ? 'bad' : ''}">
        ${samePerson ? '' : `<button class="pri" data-act="mark">✔ Mark as received</button>`}
        ${s === 'sent' ? `<button class="dan" data-act="mark" data-kind="problem">⚠ Problem (pending)</button>` : ''}</div>
      ${samePerson ? `<p class="err" style="margin:8px 0 0">You marked this doc as sent, so another person must confirm received.</p>` : ''}
      ${t.perr ? `<p class="err">${esc(t.perr)}</p>` : ''}</div>`;
  } else {
    step = `<div class="fcard" style="border-color:#86efac;background:#f0fdf4"><b style="color:#166534">✔ Received.</b> <span class="muted">This bill is complete.</span></div>`;
  }
  const labels = {created:'Created', edit:'Edited', sent:'Marked as sent', pending:'⚠ Problem (pending)', received:'Marked as received', undo_sent:'Undo sent', undo_pending:'Undo pending', undo_received:'Undo received',
                  case_on:'Flagged as case', case_off:'Case flag removed', photos_removed:'Old photos removed (auto)', attached:'Photos attached', photos_added:'Photos added', photo_deleted:'Photo deleted', folder_renamed:'Folder renamed'};
  const log = (b.log && b.log.length) ? b.log : [{act:'created', by:b.createdBy, at:b.createdAt}];

    const payload = {id:b.id || '', company:b.company, estate:b.estate, driver:b.driver, vehicle:b.vehicle, date:b.date, note:b.note || '', remark:b.remark || '',
                     rows:b.rows, seq:+b.seq, seqManual:!!(t.seqManual && me.role === 'admin')};
    let rec;
    try{ rec = mapBill(await busy(el, () => rpc('papan_save_bill', {...T(), p_bill:payload, p_version:b.id ? b.version : null}))); }
    catch(e){ if(/changed by|already used/.test(e.message)){ t.errs = [e.message]; t.mode = 'edit'; render(); } return; }
    upsert(db.bills, rec);
    const picks = t.pick || [], fids = t.attachF || []; t.pick = []; t.attachF = [];
    Object.assign(t, {type:'view', vt:'bill', billId:rec.id, key:'bill' + rec.id, title:'Doc ' + rec.docno + ' · ' + rec.estate, b:null, dirty:false});
    render();
    if(b.docno !== rec.docno && !b.id) toast('Saved as ' + rec.docno + ' (the number before it was just taken by someone else).');
    else toast('✔ Saved ' + rec.docno);
    if(el.dataset.print) printBills([rec]);
    try{
      if(fids.length) await attachFolders(rec, fids);
      if(picks.length){ const f = await ownFolder(rec); await queuePhotos(f.id, picks.map(p => p.blob)); picks.forEach(p => URL.revokeObjectURL(p.url)); }
      if(b.id) db.folders.filter(f => f.billId === rec.id).forEach(syncDriveName);
    }catch(e){ toast(e.message, true); }
    refresh(); if(curTab() === t) render();
  },
  printlist: (el, t) => printBills(filtered(t.f).slice().reverse()),
  export: (el, t) => {
    const head = ['Doc No','Date','Send up to','Driver','Vehicle','No','B/REF','Bill invoice','Supplier','Note','Remark','Status','Created by','Created at','Sent by','Sent at','Problem by','Problem at','Problem','Received by','Received at','Received remark','Case'];
    const L = [head];
    filtered(t.f).slice().reverse().forEach(b => b.rows.forEach((r, i) => L.push([{t:b.docno}, b.date, b.estate, b.driver, b.vehicle, i+1, {t:r.ref}, r.inv, r.sup, b.note, b.remark, stat(b), b.createdBy, fmtTime(b.createdAt), b.sentBy || '', fmtTime(b.sentAt), b.pendingBy || '', fmtTime(b.pendingAt), b.pendingNote || '', b.receivedBy || '', fmtTime(b.receivedAt), b.receivedNote || '', b.isCase ? 'YES' : ''])));
    const cell = v => (v && typeof v === 'object') ? '"=""' + String(v.t).replace(/"/g, '""""') + '"""' : '"' + String(v ?? '').replace(/"/g, '""') + '"';
    download('﻿' + L.map(r => r.map(cell).join(',')).join('\r\n'), 'papan-' + (t.f.month || 'all') + '.csv', 'text/csv');
  },
  sub: (el, t) => { t.sub = el.dataset.s; render(); },
  setadd: async (el, t) => {
    const L = LISTS[t.sub], o = {};
    L.fields.forEach(f => o[f[0]] = $('#new_' + f[0]).value.trim());
    if(!o[L.fields[0][0]]) return alert('Enter ' + L.fields[0][1].toLowerCase() + ' first.');
    L.fields.forEach(f => { if(f[0] !== 'phone') o[f[0]] = o[f[0]].toUpperCase(); });
    db.settings[t.sub].push(o); render(); await saveSetting(t.sub, true);
  },
  setmove: async (el, t) => { const L = db.settings[t.sub], i = +el.dataset.i, j = i + +el.dataset.d; if(j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]]; render(); await saveSetting(t.sub, true); },
  setdel: async (el, t) => { const i = +el.dataset.i; if(!confirm('Delete this item?')) return; db.settings[t.sub].splice(i, 1); render(); await saveSetting(t.sub, true); },
  useradd: async el => {
    const u = $('#nu_u').value.trim().toLowerCase(), p = $('#nu_p').value, r = $('#nu_r').value;
    if(!u || !p) return alert('Enter a username and password.');
    if(p.length < 6) return alert('Password must be at least 6 characters.');
    try{ await busy(el, () => rpc('papan_user_add', {...T(), p_username:u, p_password:p, p_role:r})); toast('User ' + u + ' added.'); await refresh(); render(); }catch(e){}
  },
  userdel: async el => { const u = db.users[+el.dataset.i]; if(!confirm('Delete user ' + u.u + '?')) return;
    try{ await busy(el, () => rpc('papan_user_delete', {...T(), p_username:u.u})); await refresh(); render(); }catch(e){} },
  userpw: async el => {
    const u = db.users[+el.dataset.i], p = prompt('New password for ' + u.u + ' (at least 6 characters):');
    if(p === null) return; if(p.length < 6) return alert('Password must be at least 6 characters.');
    try{ await busy(el, () => rpc('papan_user_password', {...T(), p_username:u.u, p_password:p})); toast('Password changed for ' + u.u + '.'); }catch(e){}
  },
  backup: () => {
    const data = {papan:'backup', version:2, exportedAt:new Date().toISOString(), settings:db.settings, bills:db.bills, folders:db.folders,
                  photos:db.photos.map(p => ({...p, url:photoUrl(p.fileId, 1600)}))};
    download(JSON.stringify(data, null, 1), 'papan-backup-' + today() + '.json', 'application/json');
    try{ localStorage.setItem('papan_last_backup', String(Date.now())); }catch(e){}
    backupReminder(); if(curTab()?.type === 'settings') render();
  },
  restore: () => $('#restoreFile').click(),
  importlocal: async el => {
    let old; try{ old = JSON.parse(localStorage.getItem('papan_v1')); }catch(e){}
    if(!old || !Array.isArray(old.bills)) return alert('No old data found in this browser.');
    if(!confirm(`Copy ${old.bills.length} bills and ${(old.folders || []).length} photo folders from this browser to the online database? Bills that already exist online are skipped.`)) return;
    try{
      const merged = {};
      Object.keys(LISTS).forEach(k => { const key = LISTS[k].fields[0][0], seen = new Set(db.settings[k].map(o => o[key]));
        merged[k] = [...db.settings[k], ...((old.settings || {})[k] || []).filter(o => o[key] && !seen.has(o[key]))]; });
      const r = await busy(el, () => rpc('papan_import', {...T(), p_data:{settings:merged, bills:old.bills, folders:old.folders || []}}));
      await refresh(true);
      let n = 0;
      try{
        const ph = await new Promise((res, rej) => { const q = indexedDB.open('papan_photos'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
        const all = await new Promise((res, rej) => { if(!ph.objectStoreNames.contains('photos')) return res([]); const tx = ph.transaction('photos'), rq = tx.objectStore('photos').getAll(); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
        const byF = {};
        all.forEach(p => { const nf = r.folderMap && r.folderMap[p.folderId]; if(nf && p.blob) (byF[nf] = byF[nf] || []).push(p.blob); });
        for(const fid in byF){ await queuePhotos(fid, byF[fid]); n += byF[fid].length; }
      }catch(e){}
      toast(`Copied ${r.bills} bills and ${r.folders} folders.` + (n ? ` ${n} photos are uploading.` : ''));
      render();
    }catch(e){}
  }
};
async function setStatus(el, b, action, note){
  try{ const r = await busy(el, () => rpc('papan_bill_status', {...T(), p_id:b.id, p_action:action, p_note:note || ''})); upsert(db.bills, mapBill(r)); }
  catch(e){ await refresh(); }
}
const setTimers = {};
function saveSetting(key, now){
  clearTimeout(setTimers[key]);
  const go = async () => { try{ await rpc('papan_save_setting', {...T(), p_key:key, p_value:db.settings[key]}); toast('✔ Saved'); }catch(e){ toast(e.message, true); refresh(); } };
  if(now) return go();
  setTimers[key] = setTimeout(go, 700);
}
$('#restoreFile').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.settings || !Array.isArray(d.bills)) throw new Error('Not a Papan backup file.');
      if(!confirm('Restore from this backup? Settings are replaced, and bills that are missing online (' + d.bills.length + ' in the file) are added back. Photos are not in the backup.')) return;
      const res = await rpc('papan_import', {...T(), p_data:{settings:d.settings, bills:d.bills, folders:[]}});
      await refresh(true); toast(`Restored. ${res.bills} missing bills added.`); render();
    }catch(err){ alert('Could not restore: ' + err.message); }
    e.target.value = '';
  };
  r.readAsText(f);
};
function download(text, name, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener('change', e => {
  const el = e.target; if(!el.dataset || !el.dataset.ffid) return;
  const t = curTab(); if(!t) return; t.attachF = t.attachF || []; t.dirty = true;
  if(el.checked){ if(!t.attachF.includes(el.dataset.ffid)) t.attachF.push(el.dataset.ffid); } else t.attachF = t.attachF.filter(x => x !== el.dataset.ffid);
});
document.addEventListener('change', async e => {
  const el = e.target; if(!el.hasAttribute || !el.hasAttribute('data-pick')) return;
  const t = curTab(); if(!t) return;
  const files = [...el.files]; el.value = ''; if(!files.length) return;
  t.busy = true; t.perr = ''; render();
  const blobs = [];
  for(const f of files){ try{ blobs.push(await shrink(f)); }catch(err){ t.perr = err.message; } }
  if(el.dataset.to === 'folder' || el.dataset.to === 'bill'){
    try{
      const fo = el.dataset.to === 'bill' ? await ownFolder(db.bills.find(x => x.id === t.billId)) : db.folders.find(x => x.id === t.openF);
      if(fo && blobs.length) await queuePhotos(fo.id, blobs);
    }catch(err){ t.perr = err.message; }
    t.busy = false; return render();
  }
  t.pick = t.pick || []; if(t.type === 'form') t.dirty = true;
  blobs.forEach(blob => t.pick.push({blob, url:URL.createObjectURL(blob)}));
  t.busy = false; render();
});
document.addEventListener('input', async e => {
  const el = e.target, k = el.dataset.bind, t = curTab(); if(!k || !t) return;
  if(k === 'flt'){ t.f[el.dataset.k] = el.value; fillList(t); }
  else if(k === 'rmonth'){ t.m = el.value; render(); }
  else if(k === 'b'){
    t.b[el.dataset.k] = el.value; t.dirty = true;
    if(el.dataset.k === 'company'){
      const ests = estatesFor(t.b.company);
      if(!ests.includes(t.b.estate)) t.b.estate = ests.length === 1 ? ests[0] : '';
      if(t.b.estate && !t.seqManual) t.b.seq = (t.origKey && seqKey(t.b.estate, t.b.date) === t.origKey) ? t.origSeq : nextSeq(t.b.estate, t.b.date, t.b.id);
      return render();
    }
    if(el.dataset.k === 'estate' || el.dataset.k === 'date'){
      if(t.b.estate && t.b.date && !t.seqManual){
        const nk = seqKey(t.b.estate, t.b.date);
        t.b.seq = (t.origKey && nk === t.origKey) ? t.origSeq : nextSeq(t.b.estate, t.b.date, t.b.id);
        const s = document.querySelector('[data-bind="seq"]'); if(s) s.value = t.b.seq;
      }
      updDoc(t);
      if(el.dataset.k === 'estate') render();
    }
  }
  else if(k === 'seq'){ if(me.role !== 'admin') return; t.b.seq = el.value; t.seqManual = true; t.dirty = true; updDoc(t); }
  else if(k === 'row' && el.dataset.c === 'sup' && el.value === '__new'){
    const i = +el.dataset.i, name = (prompt('New supplier name:') || '').trim().toUpperCase();
    if(name){
      try{ const n = await rpc('papan_add_supplier', {...T(), p_name:name}); if(!findSup(n)) db.settings.supplier.push({name:n, code:''}); t.b.rows[i].sup = n; t.dirty = true; }
      catch(err){ toast(err.message, true); }
    }
    render();
  }
  else if(k === 'row'){ t.b.rows[+el.dataset.i][el.dataset.c] = el.value; t.dirty = true; if(el.value.trim()) el.classList.remove('bad'); }
  else if(k === 'set'){ db.settings[t.sub][+el.dataset.i][el.dataset.k] = el.dataset.k === 'phone' ? el.value : el.value.toUpperCase(); saveSetting(t.sub, el.tagName === 'SELECT'); }
  else if(k === 'doc'){ db.settings.doc[el.dataset.k] = el.value; saveSetting('doc', el.tagName === 'SELECT'); if(el.dataset.k !== 'pattern') render(); else { const x = $('#docex'); if(x) x.textContent = 'Doc No: ' + fmtDoc(5, today(), db.settings.estate[0]?.name || ''); } }
  else if(k === 'docpreset'){ if(el.value){ db.settings.doc.pattern = el.value; saveSetting('doc', true); render(); } }
  else if(k === 'ph'){ t.p[el.dataset.k] = el.value; if(el.dataset.k === 'company'){ const e2 = estatesFor(t.p.company); if(!e2.includes(t.p.estate)) t.p.estate = e2.length === 1 ? e2[0] : ''; } if(el.dataset.k !== 'note' && el.dataset.k !== 'ref'){ t.perr = ''; render(); } }
  else if(k === 'fe'){ t.fe[el.dataset.k] = el.value; if(el.dataset.k === 'company'){ const e2 = estatesFor(t.fe.company); if(!e2.includes(t.fe.estate)) t.fe.estate = ''; render(); } }
  else if(k === 'pf'){ t.pf[el.dataset.k] = el.value; if(el.dataset.k === 'company') t.pf.estate = ''; t.openF = null; render(); }
  else if(k === 'pset'){ db.settings.photo[el.dataset.k] = +el.value || (el.dataset.k === 'overdue' ? 3 : 0); saveSetting('photo', el.tagName === 'SELECT'); }
  else if(k === 'role'){ const u = db.users[+el.dataset.i]; try{ await rpc('papan_user_role', {...T(), p_username:u.u, p_role:el.value}); u.role = el.value; toast('✔ Saved'); }catch(err){ toast(err.message, true); refresh(); } }
});
function updDoc(t){ const d = $('#docno'); if(d) d.textContent = t.b.estate ? fmtDoc(+t.b.seq || 0, t.b.date || today(), t.b.estate) + (t.b.id || t.seqManual ? '' : ' (est.)') : 'Choose estate'; }

init();

</script>
